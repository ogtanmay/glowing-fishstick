<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reasons to Stay</title>
    <meta
      name="description"
      content="A small reminder page with gentle reasons to stay."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>You matter. Stay.</h1>
      <p class="subtitle">One gentle reason at a time.</p>
      <section class="card" aria-live="polite">
        <p id="reason">Your story is still unfolding.</p>
      </section>
      <button id="next-reason" type="button">Show another reason</button>
      <p class="support">
        If you are in immediate danger, call your local emergency number right
        now. In the U.S. or Canada, call or text
        <a href="tel:988">988 Suicide &amp; Crisis Lifeline</a>.
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
